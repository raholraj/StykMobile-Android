name: Android APK

# Unzips StykMobile-Android.zip (uploaded to repo root) then builds debug APK via Capacitor.
# Run from Actions tab → Android APK → Run workflow. Artifact: styk-mobile-apk
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          if [ ! -f StykMobile-Android.zip ]; then
            echo "ERROR: StykMobile-Android.zip not found in repo root"
            ls -la
            exit 1
          fi
          echo "Unzipping StykMobile-Android.zip..."
          unzip -q -o StykMobile-Android.zip
          # ZIP extracts to StykAnimate-App-main/
          if [ -d StykAnimate-App-main ]; then
            echo "Replacing workspace with contents of StykAnimate-App-main"
            # Remove dirs that would conflict with mv
            rm -rf .github mobile
            shopt -s dotglob
            mv StykAnimate-App-main/* .
            rmdir StykAnimate-App-main || true
            shopt -u dotglob
          fi
          echo "Project root contents:"
          ls -la
          test -f package.json || { echo "package.json missing after unzip"; exit 1; }
          test -d mobile || { echo "mobile/ folder missing after unzip"; exit 1; }
          test -f mobile/package.json || { echo "mobile/package.json missing"; exit 1; }
          test -f scripts/build-web.mjs || { echo "scripts/build-web.mjs missing"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Only Pyodide is needed for the web build; skip the Electron binary download.
      - name: Install web build dependencies
        run: npm ci --ignore-scripts

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Unit tests of the wrapper
        working-directory: mobile
        run: npm test

      # Builds mobile/www first: `cap add` refuses to run without the web files.
      - name: Create the Android project
        working-directory: mobile
        run: npm run android:add

      - name: App icons
        working-directory: mobile
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath resources

      - name: Build the web files and sync them into the project
        working-directory: mobile
        run: npm run android:sync

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          ls -lh "$APK" || true
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: styk-mobile-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
