name: Android APK

# Builds an installable debug APK of the Capacitor wrapper in mobile/ (see mobile/README.md).
# Run it from the Actions tab ("Run workflow"); the APK is the artifact "styk-mobile-apk".
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Only Pyodide is needed for the web build; skip the Electron binary download.
      - name: Install web build dependencies
        run: npm ci --ignore-scripts

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Unit tests of the wrapper
        working-directory: mobile
        run: npm test

      # Builds mobile/www first: `cap add` refuses to run without the web files.
      - name: Create the Android project
        working-directory: mobile
        run: npm run android:add

      - name: App icons
        working-directory: mobile
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath resources

      - name: Build the web files and sync them into the project
        working-directory: mobile
        run: npm run android:sync

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: styk-mobile-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
