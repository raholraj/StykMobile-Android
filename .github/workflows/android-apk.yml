name: Android APK

# Build www first, then inject Styk AI into mobile/www, re-copy assets, APK.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          if [ ! -f StykMobile-Android.zip ]; then
            echo "ERROR: StykMobile-Android.zip not found"
            ls -la
            exit 1
          fi
          unzip -q -o StykMobile-Android.zip
          if [ -d StykAnimate-App-main ]; then
            rm -rf .github mobile
            shopt -s dotglob
            mv StykAnimate-App-main/* .
            rmdir StykAnimate-App-main || true
            shopt -u dotglob
          fi
          test -f package.json
          test -d mobile

      - name: Restore AI overlay from git
        run: |
          set -e
          git checkout HEAD -- ai-overlay .github/workflows/android-apk.yml 2>/dev/null || true
          find ai-overlay -type f || echo "no overlay"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web build dependencies
        run: npm ci --ignore-scripts

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Unit tests of the wrapper
        working-directory: mobile
        run: npm test

      - name: Create the Android project
        working-directory: mobile
        run: npm run android:add

      - name: App icons
        working-directory: mobile
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath resources

      - name: Build the web files and sync them into the project
        working-directory: mobile
        run: npm run android:sync

      - name: Inject Styk AI into mobile/www
        run: |
          set -e
          node ai-overlay/scripts/inject-ai.mjs .
          echo "=== Verify AI in www ==="
          ls -la mobile/www/src/ai/ || { echo "FAIL: no AI in www"; exit 1; }
          grep -n "ai-bootstrap" mobile/www/index.html || { echo "FAIL: no bootstrap in index"; exit 1; }
          cat mobile/capacitor.config.json

      - name: Re-sync web assets into Android after AI inject
        working-directory: mobile
        run: npx cap copy android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          ls -lh "$APK" || true

      - uses: actions/upload-artifact@v4
        with:
          name: styk-mobile-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
