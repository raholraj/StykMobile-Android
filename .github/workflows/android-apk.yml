name: Android APK

# Unzips StykMobile-Android.zip, injects Styk AI, then builds debug APK.
# Artifact: styk-mobile-apk
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          if [ ! -f StykMobile-Android.zip ]; then
            echo "ERROR: StykMobile-Android.zip not found in repo root"
            ls -la
            exit 1
          fi
          echo "Unzipping StykMobile-Android.zip..."
          unzip -q -o StykMobile-Android.zip
          if [ -d StykAnimate-App-main ]; then
            echo "Replacing workspace with contents of StykAnimate-App-main"
            rm -rf .github mobile
            shopt -s dotglob
            mv StykAnimate-App-main/* .
            rmdir StykAnimate-App-main || true
            shopt -u dotglob
          fi
          echo "Project root contents:"
          ls -la
          test -f package.json || { echo "package.json missing after unzip"; exit 1; }
          test -d mobile || { echo "mobile/ folder missing after unzip"; exit 1; }

      - name: Restore AI overlay from git
        run: |
          set -e
          git checkout HEAD -- ai-overlay .github/workflows/android-apk.yml 2>/dev/null || true
          if [ ! -d ai-overlay ]; then
            echo "WARNING: ai-overlay missing"
            ls -la
          else
            echo "AI overlay present:"
            find ai-overlay -type f
          fi

      - name: Inject Styk AI into project
        run: |
          set -e
          if [ -f ai-overlay/scripts/inject-ai.mjs ]; then
            node ai-overlay/scripts/inject-ai.mjs .
            echo "AI injection done"
            ls -la src/ai/ || true
            grep -n "ai-bootstrap\|api.groq.com" index.html | head -5 || true
          else
            echo "Skip AI inject – overlay not found"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web build dependencies
        run: npm ci --ignore-scripts

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Unit tests of the wrapper
        working-directory: mobile
        run: npm test

      - name: Create the Android project
        working-directory: mobile
        run: npm run android:add

      - name: App icons
        working-directory: mobile
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath resources

      - name: Build the web files and sync them into the project
        working-directory: mobile
        run: npm run android:sync

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          ls -lh "$APK" || true

      - uses: actions/upload-artifact@v4
        with:
          name: styk-mobile-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
